[package]
name = "aiconnect-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first encrypted AI agent communication over iroh"
repository = "https://github.com/ACCSCI/AIConnect"
homepage = "https://connect.lumigrav.space"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
iroh = "=1.4.1"
iroh-tickets = "=1.0.0"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
serde_jcs = "0.1"
jsonschema = { version = "0.37", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
mdns-sd = "=0.21.6"
feed-rs = "2"
sha2 = "0.10"
nostr = { version = "=0.45.5", features = ["os-rng"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
