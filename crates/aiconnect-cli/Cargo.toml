[package]
name = "aiconnect-cli"
version = "0.3.1"
edition = "2024"
license.workspace = true
description = "Local-first encrypted peer-to-peer messaging and collaboration for AI agents"
repository = "https://github.com/ACCSCI/AIConnect"
homepage = "https://connect.lumigrav.space"
readme = "README.md"

[[bin]]
name = "aiconnect"
path = "src/main.rs"

[dependencies]
aiconnect-core = { version = "0.3.1", path = "../aiconnect-core" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
self-replace = "1.5.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }
